<!DOCTYPE html>
<html lang="pt-BR">
<link href="https://fonts.googleapis.com/css2?family=Puritan:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundMark</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="text/javascript" src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>SoundMark</h1>
    
    <div class="buttons">
    <button id="cadastrarBtn"> Cadastrar</button>
    <button id="loginBtn"> Login</button>
    </div>  
  </header>

  <main class="site-main">
    <p>Crie sua conta ou faça login para avaliar suas músicas favoritas e novidades</p>
    <dialog id="cadastroDialog">
      
      <form method="dialog">
        <h2>Cadastro</h2>
        <label for="usuario">Nome de usuário:</label>
        <input type="text" id="usuario" name="usuario" required />
        <label for="Senha">Senha:</label>
        <input type="senha" id="senha" name="senha" required />
        <label for="Confirmar Senha">Confirmar Senha:</label>
        <input type="senha" id="confirmarSenha" name="confirmarSenha" required />
        <button type="Registrar">Registrar</button>
      </form>
    
    </dialog>

    <dialog id="loginDialog">

      <form method="dialog">

        <h2>Login</h2>
        <label for="usuario">Nome de usuário:</label>
        <input type="text" id="usuario" name="usuario" required />
        <label for="Senha">Senha:</label>
        <input type="senha" id="senha" name="senha" required />
        <button type="Login">Login</button>
        
      </form>

    </dialog>

    <h2 class="carrossel-titulo">Top músicas mais tocadas</h2>
    <div class="carrossel" id="carrossel-topmusicas">
      <div class="grupo-albuns" id="grupo-topmusicas">
        <!-- Os cards de música são inseridos aqui dinamicamente via app.js (Last.fm API) -->
        <div class="album album-loading">Carregando...</div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <small>SoundMark - Dados musicais via <a href="https://www.last.fm" target="_blank" rel="noopener noreferrer">Last.fm</a></small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
