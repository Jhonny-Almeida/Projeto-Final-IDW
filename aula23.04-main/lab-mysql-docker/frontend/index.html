<!DOCTYPE html>
<html lang="pt-BR">
<link href="https://fonts.googleapis.com/css2?family=Puritan:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundMark</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="text/javascript" src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>SoundMark</h1>
    
    <div class="buttons" id="botoesVisitante">
    <button id="cadastrarBtn"> Cadastrar</button>
    <button id="loginBtn"> Login</button>
    </div>

    <div class="buttons" id="areaLogado" hidden>
    <span id="nomeUsuarioLogado"></span>
    <button id="logoutBtn">Sair</button>
    </div>
  </header>

  <main class="site-main">
    <p>Crie sua conta ou faça login para avaliar suas músicas favoritas e novidades</p>
    <dialog id="cadastroDialog">

      <form id="cadastroForm">
        <h2>Cadastro</h2>
        <label for="cadastro-usuario">Nome de usuário:</label>
        <input type="text" id="cadastro-usuario" name="usuario" required minlength="3" />
        <label for="cadastro-senha">Senha:</label>
        <input type="password" id="cadastro-senha" name="senha" required minlength="6" />
        <label for="cadastro-confirmar-senha">Confirmar Senha:</label>
        <input type="password" id="cadastro-confirmar-senha" name="confirmarSenha" required minlength="6" />
        <p class="form-erro" id="cadastroErro"></p>
        <button type="submit">Registrar</button>
        <button type="button" class="fechar-modal" data-modal="cadastroDialog">Cancelar</button>
      </form>

    </dialog>

    <dialog id="loginDialog">

      <form id="loginForm">

        <h2>Login</h2>
        <label for="login-usuario">Nome de usuário:</label>
        <input type="text" id="login-usuario" name="usuario" required />
        <label for="login-senha">Senha:</label>
        <input type="password" id="login-senha" name="senha" required />
        <p class="form-erro" id="loginErro"></p>
        <button type="submit">Login</button>
        <button type="button" class="fechar-modal" data-modal="loginDialog">Cancelar</button>

      </form>

    </dialog>

    <h2 class="carrossel-titulo">Top músicas mais tocadas</h2>
    <div class="carrossel" id="carrossel-topmusicas">
      <div class="grupo-albuns" id="grupo-topmusicas">
        <!-- Os cards de música são inseridos aqui dinamicamente via app.js (Last.fm API) -->
        <div class="album album-loading">Carregando...</div>
      </div>
    </div>

  </main>

  <footer class="site-footer">
    <small>SoundMark - Dados musicais via <a href="https://www.last.fm" target="_blank" rel="noopener noreferrer">Last.fm</a></small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
