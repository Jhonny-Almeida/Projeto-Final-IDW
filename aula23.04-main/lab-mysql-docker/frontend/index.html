<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SoundMark- Avalie suas musicas favoritas</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <header class="site-header">
    <h1>SoundMark</h1>
    <p>Crie sua conta ou faça login para avaliar suas músicas favoritas e novidades</p>
  </header>

  <main class="body">
    <button id="cadastrarBtn"> Cadastrar</button>
    <button id="loginBtn"> Login</button>

    <dialog id="cadastroDialog">

      <form method="dialog">
        <h2>Cadastro</h2>
        <label for="usuario">Nome de usuário:</label>
        <input type="text" id="usuario" name="usuario" required />
        <label for="Senha">Senha:</label>
        <input type="senha" id="senha" name="senha" required />
        <label for="Confirmar Senha">Confirmar Senha:</label>
        <input type="senha" id="confirmarSenha" name="confirmarSenha" required />
        <button type="Registrar">Registrar</button>
      </form>
    
    </dialog>

    <dialog id="loginDialog">

      <form method="dialog">

        <h2>Login</h2>
        <label for="usuario">Nome de usuário:</label>
        <input type="text" id="usuario" name="usuario" required />
        <label for="Senha">Senha:</label>
        <input type="senha" id="senha" name="senha" required />
        <button type="Login">Login</button>
        
      </form>

    </dialog>

    <div class="carrossel">
      <div class="grupo-albuns">
        <div class="album">356</div>
        <div class="album">party</div>
        <div class="album">girl</div>
        <div class="album">keep</div>
        <div class="album">buping</div>
        <div class="album">that</div>
        
      </div>
      
      
      
      
    </div>


  </main>

  <footer class="site-footer">
    <small>SoundMark - Dados musicais via Last.fm</small>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
